name: monopoly-plus

services:
  banker:
    build: .
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      # LAN address of the host, used for the /books QR code. Set by the Makefile.
      HOST_IP: ${HOST_IP:-}
      PUBLIC_PORT: "8080"
    volumes:
      # The SQLite game file lives in ./db on the host (gitignored).
      - ./db:/var/lib/monopoly
    restart: unless-stopped
